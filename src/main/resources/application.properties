spring.application.name=prova

# ---------- Banco de dados ----------
# Formato ${VARIAVEL:valor_padrao}: usa a variavel de ambiente se existir,
# senao usa o valor padrao (que e o do Postgres local "postgres-aula").
# No deploy, o deploy.yml passa DB_HOST=postgres-aula e DB_PASSWORD (secret).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auladb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Auth0 ----------
# issuer-uri: dominio do tenant, com https:// e COM a barra no final
# audiences: Identifier da API no Auth0 (no plural: "audiences")
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://joao.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://projsoft-api}

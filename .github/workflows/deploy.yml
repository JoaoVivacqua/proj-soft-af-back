name: Deploy

# Roda em todo push na main (inclusive quando um PR e mergeado).
# Tambem pode ser disparado na mao: aba Actions > Deploy > Run workflow.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_USER: joaovivacqua
  DOCKER_IMAGE: joaovivacqua/projeto-software-af-back
  CONTAINER_NAME: prova-back

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Postgres para os testes que rodam no "mvnw package"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auladb
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: senha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d auladb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build e testes
        run: ./mvnw -B package

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Deploy na AWS (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            set -e
            IMAGEM=${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            docker pull $IMAGEM

            # remove o container antigo (se existir)
            docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # sobe o novo, na mesma rede do postgres-aula
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network rede \
              -p 8080:8080 \
              -e DB_HOST=postgres-aula \
              -e DB_NAME=auladb \
              -e DB_USER=usuario \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              $IMAGEM

            # apaga imagens antigas que nenhum container usa (libera disco)
            docker image prune -af >/dev/null || true

            # confere se a API subiu: sem token ela tem que responder 401
            for i in $(seq 1 45); do
              CODIGO=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
              if [ "$CODIGO" = "401" ]; then
                echo "API no ar (respondeu 401 sem token)."
                exit 0
              fi
              sleep 2
            done
            echo "A API nao respondeu 401. Ultimas linhas do log:"
            docker logs --tail 80 ${{ env.CONTAINER_NAME }}
            exit 1
